name: Keep Supabase awake
# Free Supabase projects pause after a week without activity. This makes one small
# read through the API twice a week. The anon key is public (it's in the app's pages).
on:
  schedule:
    - cron: "0 1 * * 1,4" # Mondays and Thursdays, 09:00 Manila
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row through the API
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Set the SUPABASE_URL and SUPABASE_ANON_KEY repository variables. See docs/deploy.md."
            exit 0
          fi
          curl -fsS --retry 3 -o /dev/null -w "Supabase answered %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/rooms?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY"
