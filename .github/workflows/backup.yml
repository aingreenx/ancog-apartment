name: Weekly backup
# Production database (and, optionally, storage files) → encrypted → private S3-compatible
# bucket (Cloudflare R2, Backblaze B2, AWS S3…). Never to this repo: it's public, and so are
# its Actions artifacts and logs. Setup: docs/deploy.md → "Backups".
on:
  schedule:
    - cron: "0 18 * * 6" # Sundays 02:00 Manila
  workflow_dispatch:

permissions:
  contents: read

concurrency: backup

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION || 'auto' }}
    steps:
      - name: Check the backup is set up
        id: config
        run: |
          missing=""
          for v in SUPABASE_DB_URL BACKUP_PASSPHRASE BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Backups aren't set up yet (missing:$missing). See docs/deploy.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: steps.config.outputs.ready == 'true'
        run: npm ci

      - name: Dump the database (roles, schema, data)
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p backup
          npx supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          npx supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          npx supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only

      - name: Copy storage files (meter photos, payment proofs, receipts, settings)
        if: steps.config.outputs.ready == 'true' && vars.SUPABASE_S3_ENDPOINT != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.SUPABASE_S3_REGION }}
          SUPABASE_S3_ENDPOINT: ${{ vars.SUPABASE_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          for bucket in meter-photos payment-proofs receipts settings; do
            aws s3 sync "s3://$bucket" "backup/storage/$bucket" --endpoint-url "$SUPABASE_S3_ENDPOINT" --only-show-errors
          done

      - name: Encrypt
        id: encrypt
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          file="ancog-$(TZ=Asia/Manila date +%Y-%m-%d-%H%M).tar.gz.gpg"
          tar -czf - -C backup . \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
                  --symmetric --cipher-algo AES256 -o "$file" 3<<<"$BACKUP_PASSPHRASE"
          rm -rf backup
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Encrypted backup: $file ($(du -h "$file" | cut -f1))"

      - name: Upload
        if: steps.config.outputs.ready == 'true'
        run: |
          aws s3 cp "${{ steps.encrypt.outputs.file }}" \
            "s3://$BACKUP_S3_BUCKET/weekly/${{ steps.encrypt.outputs.file }}" \
            --endpoint-url "$BACKUP_S3_ENDPOINT" --only-show-errors
          echo "Uploaded to $BACKUP_S3_BUCKET/weekly/"
